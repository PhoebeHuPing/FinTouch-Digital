<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASB Account Tile Component</title>
    <link rel="stylesheet" href="style.css">
    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

    <!-- AEM Component: AccountTile -->
    <!-- HTL implementation for dynamic authoring -->
    <div class="account-tile" 
         data-sly-use.model="nz.co.asb.models.AccountTileModel"
         role="region" 
         aria-label="${properties.ariaLabel || 'Account Summary'}">
        
        <div class="tile-header" style="background-color: ${properties.themeColor || '#ffd100'}">
            <div>
                <div class="account-name" data-sly-text="${properties.accountName}">Streamline</div>
                <div class="account-number" data-sly-text="${properties.accountNumber}">12-3456-7890123-00</div>
            </div>
            <div class="icon">
                <!-- Field: AccountIcon (Path to SVG in DAM) -->
                <img data-sly-test="${properties.iconPath}" src="${properties.iconPath}" alt="" />
                <svg data-sly-test="${!properties.iconPath}" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
            </div>
        </div>
        
        <div class="tile-body">
            <div class="balance-label" data-sly-text="${properties.balanceLabel || 'Available Balance'}">Available Balance</div>
            <div class="balance-amount" id="balance">${properties.initialBalance}</div>
            <div class="balance-hidden" id="balance-masked">••••••</div>
        </div>

        <div class="tile-footer">
            <button class="btn-toggle" id="toggle-balance" aria-pressed="false" 
                    data-sly-text="${properties.toggleText || 'Hide Balance'}">Hide Balance</button>
            <a href="${properties.actionLink || '#'}" class="link-details">
                ${properties.actionLinkText || 'View details'} &rsaquo;
            </a>
        </div>
    </div>

    <script>
        $(document).ready(function() {
            $('#toggle-balance').click(function() {
                const isHidden = $('#balance').is(':visible');
                if (isHidden) {
                    $('#balance').fadeOut(100, function() {
                        $('#balance-masked').fadeIn(100);
                        $('#toggle-balance').text('Show Balance').attr('aria-pressed', 'true');
                    });
                } else {
                    $('#balance-masked').fadeOut(100, function() {
                        $('#balance').fadeIn(100);
                        $('#toggle-balance').text('Hide Balance').attr('aria-pressed', 'false');
                    });
                }
            });
        });
    </script>
</body>
</html>
